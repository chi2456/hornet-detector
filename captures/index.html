<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 【修正】ズーム（ピンチアウト）を許可する設定に変更 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ハチ監視システム</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #viewer { height: 40vh; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background: #000; border-bottom: 2px solid #333; overflow: auto; }
        #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        #ui-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #222; }
        
        #search-box { padding: 10px; background: #333; flex-shrink: 0; }
        #search-box input { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border-radius: 5px; border: none; outline: none; }
        
        #file-list { flex: 1; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
        .file-item { border-bottom: 1px solid #444; }
        .file-link { display: flex; justify-content: space-between; padding: 15px; color: #ccc; text-decoration: none; font-size: 15px; }
        .file-link:hover { background: #333; }
        
        .alert { color: #ff4444; font-weight: bold; background: rgba(255, 68, 68, 0.1); }
        .alert-icon::before { content: "⚠️ "; }
        
        .selected { border-left: 5px solid #00ffcc; background: #444; }
        
        .time-text { font-family: monospace; font-size: 16px; }
        .conf-text { font-size: 13px; color: #888; }
        .alert .conf-text { color: #ff8888; }
    </style>
</head>
<body>

    <div id="viewer">
        <img id="main-img" src="" alt="画像がありません">
    </div>
    
    <div id="ui-area">
        <div id="search-box">
            <input type="text" id="search-input" placeholder="🔍 時間で検索 (例: 12-30)..." onkeyup="filterFiles()">
        </div>
        <ul id="file-list">
            <!-- ファイル一覧 -->
        </ul>
    </div>

    <script>
        let allFiles = [];

        // ファイル名（2026-07-14_12-30-00.000_conf80.0.jpg）を綺麗な文字に変換する関数
        function formatFileName(filename) {
            try {
                // 文字列を「_」で分割する
                const parts = filename.split('_');
                // parts[1] は "12-30-00.000" になるはずなので、時間の部分だけ取り出す
                const timeStr = parts[1].split('.')[0].replace(/-/g, ':');
                
                // conf（確率）が含まれているかチェック
                if (filename.includes('_conf')) {
                    // "conf80.0.jpg" から "80.0" だけを抜き出す
                    const confPart = parts[2].replace('conf', '').replace('.jpg', '');
                    return { time: timeStr, text: `ハチ検知: ${confPart}%`, isAlert: true };
                } else {
                    return { time: timeStr, text: "異常なし", isAlert: false };
                }
            } catch (e) {
                // ファイル名の形式が違うテスト用画像などの場合は、そのまま返す
                return { time: filename, text: "", isAlert: false };
            }
        }

        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                allFiles = await response.json();
                renderList(allFiles);
                if (allFiles.length > 0 && document.getElementById('main-img').src.endsWith("index.html")) {
                    showImage(allFiles[0]);
                }
            } catch (error) {
                console.error("ファイルの読み込みに失敗しました", error);
            }
        }

        function renderList(files) {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'file-link';
                
                // ファイル名を綺麗な形式に変換
                const fileInfo = formatFileName(file);
                
                // HTMLを組み立てる（左側に時間、右側に確率）
                let innerHtml = `<span class="time-text ${fileInfo.isAlert ? 'alert-icon' : ''}">${fileInfo.time}</span>`;
                innerHtml += `<span class="conf-text">${fileInfo.text}</span>`;
                a.innerHTML = innerHtml;
                
                if (fileInfo.isAlert) {
                    a.classList.add('alert');
                }
                
                a.onclick = (e) => {
                    e.preventDefault(); 
                    showImage(file);
                    
                    document.querySelectorAll('.file-link').forEach(el => el.classList.remove('selected'));
                    a.classList.add('selected');
                };
                
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        function showImage(filename) {
            document.getElementById('main-img').src = '/' + filename;
        }

        function filterFiles() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allFiles.filter(file => file.toLowerCase().includes(query));
            renderList(filtered);
        }

        loadFiles();
        setInterval(loadFiles, 10000);
    </script>
</body>
</html>
